services:
  postgres:
    image: postgres:16-alpine
    container_name: thews_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: thews_user
      POSTGRES_PASSWORD: thews_password
      POSTGRES_DB: thews_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
