    <path d="M20 85 L80 85" /> <!-- Belt surface -->

    <!-- Torso -->
    <path d="M50 32 L45 55" />

    <path d="M45 55 L30 70 L40 85" opacity="0.6" stroke-width="4" />
    <!-- Front Arm -->
    <path d="M48 38 L65 45 L60 55" />
    <!-- Back Arm -->
    <path d="M48 38 L35 42 L30 55" opacity="0.6" stroke-width="4" />
  </g>
