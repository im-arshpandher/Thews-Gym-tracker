                icon.textContent = 'check_box';
                icon.style.fontVariationSettings = "'FILL' 1";

                row.querySelector('span.rounded-full').className = 'w-6 h-6 rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center font-body-md text-body-md';

            } else {

    }, 1000);
