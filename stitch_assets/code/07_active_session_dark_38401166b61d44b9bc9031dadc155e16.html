<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-primary-fixed-variant": "#3c4d00", "inverse-surface": "#e5e2e1", "surface-container-low": "#1c1b1b", "on-secondary": "#313030", "primary-container": "#c3f400", "inverse-primary": "#506600", "surface-tint": "#abd600", "primary-fixed": "#c3f400", "on-error": "#690005", "inverse-on-surface": "#313030", "tertiary": "#ffffff", "outline": "#8e9379", "surface-dim": "#131313", "primary": "#ffffff", "tertiary-fixed": "#e4e2e1", "secondary": "#c8c6c5", "surface-container-highest": "#353534", "secondary-fixed": "#e5e2e1", "on-error-container": "#ffdad6", "on-tertiary-fixed": "#1b1c1c", "surface-variant": "#353534", "on-tertiary": "#303030", "surface-container": "#201f1f", "on-tertiary-fixed-variant": "#474747", "on-secondary-container": "#b7b5b4", "secondary-fixed-dim": "#c8c6c5", "on-secondary-fixed-variant": "#474746", "error-container": "#93000a", "surface": "#131313", "surface-container-high": "#2a2a2a", "on-tertiary-container": "#656464", "on-background": "#e5e2e1", "on-primary-fixed": "#161e00", "on-primary": "#283500", "on-surface-variant": "#c4c9ac", "surface-bright": "#3a3939", "primary-fixed-dim": "#abd600", "outline-variant": "#444933", "surface-container-lowest": "#0e0e0e", "on-primary-container": "#556d00", "on-secondary-fixed": "#1c1b1b", "tertiary-fixed-dim": "#c8c6c6", "secondary-container": "#474746", "error": "#ffb4ab", "background": "#131313", "on-surface": "#e5e2e1", "tertiary-container": "#e4e2e1" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "base": "8px", "card-padding": "24px", "section-gap": "40px", "container-margin": "20px", "gutter": "16px" }, "fontFamily": { "body-md": ["Inter"], "headline-md": ["Mo   </head><body class="dark bg-background text-on-surface min-h-screen flex flex-col font-body-md"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe"><div class="h-16 px-container-margin flex items-center gap-gutter"><button class="w-12 h-12 flex items-center justify-center text-on-surface hover:bg-surface-variant/20 rounded-full transition-colors" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><h1 class="font-headline-md text-headline-md text-on-surface uppercase">Active Session</h1></div></header><main class="flex-1 pt-16 bg-background"><div class="flex flex-col w-full h-full pb-safe">
<!-- Main Focus Area -->
<div class="flex-1 flex flex-col items-center justify-center px-container-margin relative mt-16 mb-24">
<!-- Background Glow -->
<div class="absolute inset-0 flex items-center justify-center opacity-30 pointer-events-none">
<div class="w-64 h-64 bg-primary-fixed rounded-full blur-[100px]"></div>
</div>
<!-- Exercise Info -->
<div class="z-10 text-center mb-section-gap w-full">
<span class="inline-block px-3 py-1 rounded-full bg-surface-container-high text-on-surface-variant font-label-caps text-label-caps tracking-widest mb-4 uppercase">
                Rest &amp; Recover
            </span>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2 truncate px-4">
                Barbell Bench Press
            </h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                Next: Set 3 of 4 • 8 Reps • 135 lbs
            </p>
</div>
<!-- Timer Ring -->
<div class="relative z-10 w-72 h-72 flex items-center justify-center mb-section-gap group cursor-pointer" onclick="toggleTimer()">
<!-- SVG Ring -->
<svg class="absolute inset-0 w-full h-full -rotate-90" viewbox="0 0 100 100">
<circle class="stroke-surface-container-highest" cx="50" cy="50" fill="none" r="46" stroke-width="2"></circle>
<circle class="stroke-primary-fixed transition-all duration-1000 ease-linear" cx="50" cy="50" fill="none" id="progress-ring" r="46" stroke-dasharray="289" stroke-dashoffset="115" stroke-linecap="round" stroke-width="4" style="filter: drop-shadow(0 0 8px rgba(195, 244, 0, 0.5));"></circle>
</svg>
<!-- Timer Text -->
<div class="text-center flex flex-col items-center">
<span class="font-display-metrics text-display-metrics text-on-surface tabular-nums tracking-tighter" id="timer-text">01:30</span>
<div class="flex items-center gap-2 mt-2 text-primary-fixed opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">pause</span>
<span class="font-label-caps text-label-caps uppercase">Pause</span>
</div>
</div>
</div>
<!-- Controls -->
<div class="z-10 flex items-center justify-center gap-gutter w-full max-w-sm">
<button class="flex-1 h-14 rounded-full bg-surface-container-high text-on-surface font-label-caps text-label-caps uppercase tracking-wider flex items-center justify-center gap-2 hover:bg-surface-variant transition-colors active:scale-95">
<span class="material-symbols-outlined">add</span>
                30s
            </button>
<button class="flex-1 h-14 rounded-full bg-surface-container-high text-on-surface font-label-caps text-label-caps uppercase tracking-wider flex items-center justify-center gap-2 hover:bg-surface-variant transition-colors active:scale-95">
                Skip
                <span class="material-symbols-outlined">skip_next</span>
</button>
</div>
</div>
<!-- Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface/80 backdrop-blur-xl border-t border-surface-container pb-safe z-40">
<div class="px-container-margin py-4">
<button class="w-full h-14 rounded-full bg-primary-fixed text-on-primary-fixed font-headline-md text-[18px] uppercase tracking-wide flex items-center justify-center hover:brightness-110 transition-all active:scale-95 shadow-[0_4px_20px_rgba(195,244,0,0.2)]">
                Start Next Set
            </button>
</div>
</div>
</div>
<script>
    let isPaused = false;
    function toggleTimer() {
        isPaused = !isPaused;
        const icon = document.querySelector('.group-hover\\:opacity-100 .material-symbols-outlined');
        const text = document.querySelector('.group-hover\\:opacity-100 span:last-child');
        if (isPaused) {
            icon.textContent = 'play_arrow';
            text.textContent = 'Resume';
            document.getElementById('timer-text').classList.add('opacity-50');
        } else {
            icon.textContent = 'pause';
            text.textContent = 'Pause';
            document.getElementById('timer-text').classList.remove('opacity-50');
        }
    }
</script></main></body></html>
