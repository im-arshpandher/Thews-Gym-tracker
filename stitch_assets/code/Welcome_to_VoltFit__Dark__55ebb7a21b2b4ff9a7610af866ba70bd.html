<script>
    // Simple particle effect to add subtle energy to the background
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('particle-container');
        if (!container) return;

        const numParticles = 15;
        const colors = ['#c3f400', '#abd600']; // Primary and tint

        for (let i = 0; i < numParticles; i++) {
            createParticle(container, colors);
        }

        function createParticle(parent, colorArray) {
            const particle = document.createElement('div');
            
            // Random properties
            const size = Math.random() * 4 + 2; // 2px to 6px
            const startX = Math.random() * 100;
            const startY = 100 + (Math.random() * 20); // Start slightly below bottom
            const duration = Math.random() * 4 + 3; // 3s to 7s
            const delay = Math.random() * 5;
            const color = colorArray[Math.floor(Math.random() * colorArray.length)];
            
            // Styling
            particle.className = 'absolute rounded-full opacity-0';
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.backgroundColor = color;
            particle.style.left = `${startX}%`;
            particle.style.bottom = `-10px`;
            particle.style.boxShadow = `0 0 ${size * 2}px ${color}`;
            
            // Animation via WAAPI
            const animation = particle.animate([
                { transform: `translateY(0) scale(1)`, opacity: 0 },
                { opacity: 0.6, offset: 0.2 },
                { opacity: 0.8, offset: 0.5 },
                { transform: `translateY(-${Math.random() * 60 + 40}vh) scale(0)`, opacity: 0 }
            ], {
                duration: duration * 1000,
                delay: delay * 1000,
                iterations: Infinity,
                easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
            });

            parent.appendChild(particle);
        }
        
        // Button interaction polish
        const btn = document.getElementById('getStartedBtn');
        if(btn) {
            btn.addEventListener('touchstart', () => {
                // Trigger a slight haptic-like visual feedback on touch devices
                btn.style.transform = 'scale(0.96)';
            });
            btn.addEventListener('touchend', () => {
                btn.style.transform = 'scale(1)';
            });
        }
    });
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container/90 backdrop-blur-xl" data-active-classes="text-primary-fixed-dim glow-primary"><div class="flex justify-around items-center h-16 px-gutter"><a aria-current="page" class="flex flex-col items-center gap-1 transition-colors duration-200 text-primary-fixed-dim glow-primary" data-path="home" href="#"><span class="material-symbols-outlined">home</span><span class="font-label-caps text-label-caps">HOME</span></a><a class="flex flex-col items-center gap-1 text-on-surface-variant transition-colors duration-200" data-path="log" href="#"><span class="material-symbols-outlined">add_circle</span><span class="font-label-caps text-label-caps">LOG</span></a><a class="flex flex-col items-center gap-1 text-on-surface-variant transition-colors duration-200" data-path="history" href="#"><span class="material-symbols-outlined">history</span><span class="font-label-caps text-label-caps">HISTORY</span></a><a class="flex flex-col items-center gap-1 text-on-surface-variant transition-colors duration-200" data-path="profile" href="#"><span class="material-symbols-outlined">person</span><span class="font-label-caps text-label-caps">PROFILE</span></a></div></nav></body></html>
