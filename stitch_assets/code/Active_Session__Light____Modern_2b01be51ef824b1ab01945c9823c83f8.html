</script><style>@layer base { body { -webkit-tap-highlight-color: transparent; } .pb-safe { padding-bottom: env(safe-area-inset-bottom); } .pt-safe { padding-top: env(safe-area-inset-top); } }</style><style>

</head><body class="light bg-background text-on-surface min-h-screen flex flex-col font-body-md"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe"><div class="h-16 px-container-margin flex items-center gap-gutter"><button class="w-12 h-12 flex items-center justify-center text-on-surface hover:bg-surface-variant/20 rounded-full transition-colors" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><h1 class="font-headline-md text-headline-md text-on-surface uppercase">Active Session</h1></div></header><main class="flex-1 pt-16 bg-background"><div class="flex flex-col w-full h-full pb-24 font-body-md text-on-surface bg-background">
<!-- Active Workout Header Area -->
<div class="px-container-margin pt-6 pb-4">
<div class="flex justify-between items-center mb-2">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Current Set</span>
<span class="font-body-md text-body-md text-primary-fixed drop-shadow-[0_0_4px_rgba(204,255,0,0.5)]">Set 3 of 4</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Barbell Squat</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-1">225 lbs × 8 reps</p>
</div>
<!-- Main Timer Card -->
<div class="flex-1 px-container-margin flex flex-col items-center justify-center">
<div class="w-full max-w-[340px] aspect-square rounded-[40px] bg-surface-container relative flex flex-col items-center justify-center shadow-[0_8px_32px_rgba(0,0,0,0.08)] border border-outline-variant/30">
<!-- Decorative Progress Ring (SVG) -->
<svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewbox="0 0 100 100">
<circle class="stroke-surface-container-highest" cx="50" cy="50" fill="none" r="46" stroke-width="4"></circle>
<circle class="stroke-primary-fixed drop-shadow-[0_0_8px_rgba(204,255,0,0.6)] transition-all duration-1000 ease-linear" cx="50" cy="50" fill="none" id="timer-ring" r="46" stroke-dasharray="289.026" stroke-dashoffset="50" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<!-- Timer Text -->
<div class="text-center z-10 flex flex-col items-center">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-2 tracking-widest uppercase">Rest</span>
<div class="font-display-metrics text-[72px] leading-none text-on-surface tracking-tighter mb-1" id="timer-text">
          01:30
        </div>
<span class="font-body-md text-body-md text-[#88aa00] flex items-center gap-1 mt-2">
<span class="material-symbols-outlined text-[18px]">pace</span>
          Target: 02:00
        </span>
</div>
</div>
</div>
<!-- Controls -->
<div class="px-container-margin mt-8 flex justify-center items-center gap-6">
<button class="w-16 h-16 rounded-full bg-surface-container shadow-sm border border-outline-variant/20 flex items-center justify-center text-on-surface hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-[32px]">skip_previous</span>
</button>
<button class="w-24 h-24 rounded-[32px] bg-primary-fixed text-on-primary-fixed flex items-center justify-center shadow-[0_8px_24px_rgba(204,255,0,0.4)] hover:brightness-95 transition-all active:scale-95" id="play-pause-btn">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="w-16 h-16 rounded-full bg-surface-container shadow-sm border border-outline-variant/20 flex items-center justify-center text-on-surface hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-[32px]">skip_next</span>
</button>
</div>
<!-- Next Up Preview -->
<div class="px-container-margin mt-12 mb-safe">
<div class="bg-surface-container rounded-2xl p-card-padding flex items-center justify-between shadow-[0_4px_16px_rgba(0,0,0,0.05)] border border-outline-variant/30">
<div>
<span class="font-label-caps text-label-caps text-on-surface-variant mb-1 block uppercase">Next Up</span>
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Leg Press</span>
</div>
<div class="text-right">
<span class="font-body-md text-body-md text-on-surface block font-medium">315 lbs</span>
<span class="font-body-md text-body-md text-on-surface-variant">10 reps</span>
</div>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const playPauseBtn = document.getElementById('play-pause-btn');
      const playPauseIcon = playPauseBtn.querySelector('.material-symbols-outlined');
      const timerRing = document.getElementById('timer-ring');
      const timerText = document.getElementById('timer-text');
      
      let isPlaying = true;
      let timeLeft = 90; // 1:30 in seconds
      const totalTime = 120; // 2:00 in seconds
      const circumference = 2 * Math.PI * 46;

      playPauseBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playPauseIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
        if (isPlaying) {
          playPauseBtn.classList.add('shadow-[0_8px_24px_rgba(204,255,0,0.4)]');
        } else {
          playPauseBtn.classList.remove('shadow-[0_8px_24px_rgba(204,255,0,0.4)]');
        }
      });

      // Simple mock timer update for visual effect
      setInterval(() => {
        if (!isPlaying) return;
        
        timeLeft--;
        if (timeLeft < 0) timeLeft = totalTime;

        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerText.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

        const progress = timeLeft / totalTime;
        const offset = circumference - (progress * circumference);
        timerRing.style.strokeDashoffset = offset;
      }, 1000);
    });
  </script>
</div></main></body></html>
